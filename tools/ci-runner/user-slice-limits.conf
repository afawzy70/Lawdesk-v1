# Drop-in for user-<uid>.slice of lawdesk-ci, installed as /etc/systemd/system/user-<uid>.slice.d/lawdesk-limits.conf
# (docs/operations/CI-RUNNER.md). Root-owned, so it is the ceiling lawdesk-ci cannot raise: it caps the rootless Docker
# daemon, its containers and any login session of that user. Same values as lawdesk-ci-docker.service.
[Slice]
CPUQuota=300%
MemoryHigh=4500M
MemoryMax=5G
TasksMax=8192

# Drop-in for actions.runner.afawzy70-Lawdesk-v1.contabo.service (docs/operations/CI-RUNNER.md); @UID@ is the numeric id
# of lawdesk-ci, filled in by setup-rootless-docker.sh.
#
# Bounds what CI jobs (Maven, Node, the Docker CLI) may use on the host shared with Matbakhy, and starts the runner after
# lawdesk-ci's user manager, which runs its Docker daemon. Jobs run one at a time on this single runner, so the runner and
# the daemon rarely peak together.
[Unit]
Wants=user@@UID@.service
After=user@@UID@.service

[Service]
CPUQuota=400%
MemoryHigh=6500M
MemoryMax=7G
TasksMax=8192
IOWeight=50
Nice=10
# A job that outgrows the limit is killed on its own; the service restarts.
OOMPolicy=continue

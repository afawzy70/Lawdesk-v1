spring:
  application:
    name: lawdesk-backend
  lifecycle:
    # Must stay below the container stop grace period (LD-006).
    timeout-per-shutdown-phase: 20s
  # Connection settings come from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD; no defaults are committed.
  datasource:
    hikari:
      # Readiness must report a database outage within 5 s (owner decision 2026-10-23); HikariCP's default 30 s
      # wait for a connection made the probe hang instead. Validation stays below the connection timeout.
      connection-timeout: 3000
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Schema changes happen only through versioned migrations in db/migration.
    locations: classpath:db/migration
    # Each workstream owns a version range (architecture/CONTRACTS.md §2), so a lower version may land after a higher
    # one; future versions stay ignored when an older release runs (rollback).
    out-of-order: true
    ignore-migration-patterns: "*:future"
  # LD-026 (architecture/CONTRACTS.md §8.1, §8.3): PDF uploads of at most 10 MiB. Parts are read lazily, when the
  # document endpoint asks for them, so the permission check runs before the body is parsed (QAD-026) and an
  # oversized upload is answered by the document endpoint as a 400 problem.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      resolve-lazily: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  shutdown: graceful
  servlet:
    session:
      # LD-007.3: idle timeout (ASSUMPTION) and the session cookie the SPA never reads.
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
  # Runs behind the HTTPS reverse proxy; trust its X-Forwarded-* headers.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  info:
    build:
      enabled: true

logging:
  structured:
    format:
      console: ecs

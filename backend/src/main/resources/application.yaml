spring:
  application:
    name: lawdesk-backend
  lifecycle:
    # Must stay below the container stop grace period (LD-006).
    timeout-per-shutdown-phase: 20s
  # Connection settings come from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD; no defaults are committed.
  datasource:
    hikari:
      # Readiness must report a database outage within 5 s (owner decision 2026-10-23); HikariCP's default 30 s
      # wait for a connection made the probe hang instead. Validation stays below the connection timeout.
      connection-timeout: 3000
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Schema changes happen only through versioned migrations in db/migration.
    locations: classpath:db/migration

server:
  shutdown: graceful
  # Runs behind the HTTPS reverse proxy; trust its X-Forwarded-* headers.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  info:
    build:
      enabled: true

logging:
  structured:
    format:
      console: ecs

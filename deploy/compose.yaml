# LawDesk staging stack (LD-006). Shares the host with Matbakhy, so it is fully isolated:
# own project name and volumes, no published host ports, database and API on an internal-only network.
# The only ingress is the `lawdesk-edge` network, which the HTTPS reverse proxy joins once the owner approves it
# (see deploy/README.md). Release images are selected with LAWDESK_REGISTRY and LAWDESK_TAG (a full commit SHA).
# deploy/tests/test_compose.py enforces these rules.
name: lawdesk-staging

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  db:
    <<: *hardening
    image: postgres:18.6-alpine3.24@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    # The official entrypoint initialises the data directory as root, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: lawdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      LAWDESK_APP_PASSWORD_FILE: /run/secrets/db_app_password
    secrets: [db_admin_password, db_app_password]
    volumes:
      - db-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "lawdesk"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    <<: *hardening
    image: ${LAWDESK_REGISTRY:?set LAWDESK_REGISTRY}/backend:${LAWDESK_TAG:?set LAWDESK_TAG to the release commit SHA}
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lawdesk
      SPRING_DATASOURCE_USERNAME: lawdesk_app
      # The deployed commit, recorded in app_release and the start log line.
      LAWDESK_RELEASE: ${LAWDESK_TAG:?set LAWDESK_TAG to the release commit SHA}
      # The password is read from /run/secrets/spring.datasource.password.
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    secrets:
      - source: db_app_password
        target: spring.datasource.password
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    mem_limit: 768m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  web:
    <<: *hardening
    image: ${LAWDESK_REGISTRY:?set LAWDESK_REGISTRY}/web:${LAWDESK_TAG:?set LAWDESK_TAG to the release commit SHA}
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
    networks:
      internal: {}
      edge:
        aliases: [lawdesk-web]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  internal:
    internal: true
  edge:
    external: true
    name: lawdesk-edge

volumes:
  db-data: {}

secrets:
  db_admin_password:
    file: ./secrets/db_admin_password.txt
  db_app_password:
    file: ./secrets/db_app_password.txt

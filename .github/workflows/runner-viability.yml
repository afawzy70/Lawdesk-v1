# Harmless POC for the manually started runner; no checkout, secrets, or Docker.
name: Self-hosted runner viability

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/runner-viability.yml

permissions: {}

concurrency:
  group: lawdesk-ci-poc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  schedule-probe:
    name: Self-hosted scheduling probe
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'infra/actions-billing-runner'
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Confirm harmless step executed
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = self-hosted
          test "$(id -u)" -ne 0
          printf 'LAWDESK_CI_POC_EXECUTED runner=%s user=%s\n' "${RUNNER_NAME:-unknown}" "$(id -un)"

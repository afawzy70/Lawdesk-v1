# A scheduling probe only. This job has no checkout, secrets, or deployment access.
# Remove it after the proof and keep its result in the CI recovery runbook.
name: Self-hosted runner viability

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/runner-viability.yml
      - docs/operations/CI-BILLING-RECOVERY.md
      - tools/ci-runner/contabo-rootless-preflight.sh

permissions: {}

concurrency:
  group: lawdesk-ci-poc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  schedule-probe:
    name: Self-hosted scheduling probe
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'infra/actions-billing-runner'
    runs-on: [self-hosted, lawdesk-ci-poc-49]
    timeout-minutes: 2
    steps:
      - name: Confirm execution on the isolated proof runner
        shell: bash
        run: |
          set -euo pipefail
          printf 'LAWDESK_CI_POC_EXECUTED\n'
          test "$(id -u)" -ne 0
          test ! -e /var/run/docker.sock
          test ! -e /srv/deployments/lawdesk
          test ! -e /srv/ai-workspaces/secrets
          test ! -e /srv/deployments/matbakhy
          test ! -e /home/aiagent
          test ! -e /home/devops
          # Fail closed if Docker isolation or cgroup limits were not applied.
          grep -Eq '^NoNewPrivs:[[:space:]]+1 /proc/self/status
          grep -Eq '^Seccomp:[[:space:]]+2 /proc/self/status
          grep -Eq '^CapEff:[[:space:]]+0{16} /proc/self/status
          awk 'NR == 1 { exit !($2 != 0 && $3 < 4294967295) }' /proc/self/uid_map
          test "$(cat /sys/fs/cgroup/memory.max)" -le 1073741824
          test "$(cat /sys/fs/cgroup/pids.max)" -le 128
          awk 'NR == 1 { exit !($1 != "max" && $1 <= $2) }' /sys/fs/cgroup/cpu.max

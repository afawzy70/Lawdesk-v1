# LawDesk quality gates (LD-005). Every job must pass before a pull request into develop or main is merged.
# tools/tests/test_ci_workflow.py pins down what this file must enforce; change both together.
# Every job runs on the self-hosted Contabo runner (owner decision 2026-10-25; docs/operations/CI-RUNNER.md). That runner
# is persistent and shared with pull request code, so no job may use the host Docker socket, escalate to root or read
# a secret: Docker steps talk to the runner's own rootless daemon (DOCKER_HOST is set in the runner's .env) and clean
# up after themselves.
name: CI

on:
  pull_request:
    branches: [develop, main]
    # One runner runs one job at a time: a draft pull request is work in progress and waits; marking it ready starts
    # its run (docs/operations/CI-RUNNER.md).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; pushes to develop/main never are, so a deployment always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Repository policy
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Repository tooling tests
        run: python -I -m unittest discover -s tools/tests -v
      - name: Deployment tests
        run: python -I -m unittest discover -s deploy/tests -v
      - name: Required repository files
        run: python -I tools/repo_policy.py layout
      - name: Branch flow and commit messages
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python -I tools/repo_policy.py pr "$HEAD_REF" "$BASE_REF"
            commits=$(git rev-list "$BASE_SHA..$HEAD_SHA")
          else
            commits=$(git rev-parse HEAD)
          fi
          status=0
          for commit in $commits; do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            python -I tools/repo_policy.py commit-msg "$RUNNER_TEMP/message" || { echo "::error::commit $commit"; status=1; }
          done
          exit $status
      - name: Lint workflows (actionlint 1.7.12)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Lint shell scripts (shellcheck 0.11.0)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          git ls-files '*.sh' .githooks deploy/host | xargs "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck"

  backend:
    name: Backend (Java 21, embedded PostgreSQL 18.6)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Keep test reports
        if: failure()
        # Best effort: the account's artifact storage quota can be exhausted (seen 2026-10-23); never mask the test result.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  backend-postgres-image:
    name: Backend against postgres:18.6 image
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway credentials for an ephemeral CI container bound to the loopback interface; not used anywhere else.
      LAWDESK_TEST_DB_USER: postgres
      LAWDESK_TEST_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start the official PostgreSQL 18.6 image (loopback only)
        # Not a `services:` block: a service port is published on every interface of the shared host.
        run: |
          name="lawdesk-ci-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "$name" > /dev/null 2>&1 || true
          docker run -d --name "$name" -e POSTGRES_PASSWORD="$LAWDESK_TEST_DB_PASSWORD" -p 127.0.0.1::5432 \
            --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10 \
            postgres:18.6-alpine
          echo "PG_CONTAINER=$name" >> "$GITHUB_ENV"
          port=$(docker port "$name" 5432/tcp | head -n 1 | sed 's/.*://')
          echo "LAWDESK_TEST_DB_URL=jdbc:postgresql://127.0.0.1:$port/postgres" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$name")" = healthy ] && exit 0
            sleep 2
          done
          docker logs --tail 50 "$name"
          exit 1
      - name: Test against the official image
        run: ./mvnw -B -ntp test
      - name: Remove the database container
        if: always()
        run: docker rm -f "${PG_CONTAINER:-lawdesk-ci-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}" > /dev/null 2>&1 || true

  frontend:
    name: Frontend (Node 22)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  stack:
    name: Staging stack (images + compose smoke)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      # The registry name the host gate and the rollback drill use for images built on the host.
      LAWDESK_REGISTRY: lawdesk-local
      LAWDESK_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove leftovers of an earlier run
        # The runner and its Docker daemon persist between jobs; an interrupted run may have left the stack behind.
        run: |
          docker compose -p lawdesk-staging -f deploy/compose.yaml down -v --remove-orphans > /dev/null 2>&1 || true
          docker network rm lawdesk-edge > /dev/null 2>&1 || true
      - name: Build images
        run: |
          docker build -f backend/Dockerfile --label "org.opencontainers.image.revision=$LAWDESK_TAG" \
            -t "$LAWDESK_REGISTRY/backend:$LAWDESK_TAG" backend
          docker build -f frontend/Dockerfile --label "org.opencontainers.image.revision=$LAWDESK_TAG" \
            -t "$LAWDESK_REGISTRY/web:$LAWDESK_TAG" frontend
      - name: Prepare throwaway secrets and the edge network
        run: |
          mkdir -p deploy/secrets
          openssl rand -hex 24 > deploy/secrets/db_admin_password.txt
          openssl rand -hex 24 > deploy/secrets/db_app_password.txt
          openssl rand -hex 16 > deploy/secrets/admin_bootstrap_password.txt
          docker network inspect lawdesk-edge > /dev/null 2>&1 || docker network create lawdesk-edge
      - name: Start the stack and wait for health checks
        run: |
          # Same order as deploy/scripts/deploy.sh: database, its least-privilege role, then everything.
          compose() { docker compose -p lawdesk-staging -f deploy/compose.yaml "$@"; }
          compose up -d --wait --wait-timeout 300 db
          compose exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d postgres -q < deploy/postgres/app-role.sql
          compose up -d --wait --wait-timeout 300
      - name: Smoke test
        run: deploy/scripts/smoke.sh
      - name: The bootstrap administrator signs in through nginx
        run: |
          # LD-007/LD-008.4: CSRF cookie, then sign-in, both through the web container, as the browser does.
          docker compose -p lawdesk-staging -f deploy/compose.yaml exec -T \
            -e PW="$(cat deploy/secrets/admin_bootstrap_password.txt)" web sh -euc '
            base=http://127.0.0.1:8080
            token=$(wget -q -S -O /dev/null "$base/api/v1/auth/csrf" 2>&1 | sed -n "s/.*Set-Cookie: XSRF-TOKEN=\([^;]*\).*/\1/p")
            [ -n "$token" ]
            body=$(wget -q -O - --header "Content-Type: application/json" --header "X-XSRF-TOKEN: $token" \
              --header "Cookie: XSRF-TOKEN=$token" --post-data "{\"login\":\"admin\",\"password\":\"$PW\"}" \
              "$base/api/v1/auth/login")
            case "$body" in
              *"\"mustChangePassword\":true"*) echo "ok   admin signed in; password change required" ;;
              *) echo "FAIL sign-in answered: $body" >&2; exit 1 ;;
            esac'
      - name: Backend runs as the least-privilege role
        run: |
          docker compose -p lawdesk-staging -f deploy/compose.yaml exec -T db \
            psql -U postgres -d lawdesk -tAc "select rolsuper or rolcreaterole or rolcreatedb from pg_roles where rolname = 'lawdesk_app'" \
            | grep -qx f
          docker compose -p lawdesk-staging -f deploy/compose.yaml exec -T db \
            psql -U postgres -d lawdesk -tAc "select count(*) from lawdesk.app_release where version = '$LAWDESK_TAG'" | grep -qx 1
      - name: Readiness follows a database outage and recovery
        run: |
          compose() { docker compose -p lawdesk-staging -f deploy/compose.yaml "$@"; }
          status() { compose exec -T web wget -q -S -O /dev/null "http://127.0.0.1:8080$1" 2>&1 | grep -o 'HTTP/1\.[01] [0-9][0-9][0-9]' | tail -n 1 | cut -d ' ' -f 2; }
          readiness() { status /actuator/health/readiness; }
          compose stop db
          # The first probe after the database stops must already answer 503, in under 5 s (owner decision).
          for probe in 1 2 3; do
            started=$(date +%s%N)
            code=$(readiness)
            took=$(( ($(date +%s%N) - started) / 1000000 ))
            echo "outage probe $probe: readiness $code in $took ms"
            [ "$code" = 503 ]
            [ "$took" -lt 5000 ]
          done
          echo "readiness 503 while the database is down"
          [ "$(status /actuator/health/liveness)" = 200 ]
          echo "liveness still 200"
          compose start db
          for _ in $(seq 1 60); do [ "$(readiness)" = 200 ] && break; sleep 2; done
          deploy/scripts/smoke.sh
      - name: Host-mode deploy, repeat deploy and rollback drill on real images
        run: |
          # The host layout of /srv/deployments/lawdesk, on this disposable runner: the release unpacked by commit as
          # the gate and the operator unpack it (umask 027, so nothing is world-readable), a fresh database volume,
          # the generated secrets, state, backups. This is how the first install on Contabo starts.
          docker compose -p lawdesk-staging -f deploy/compose.yaml down -v
          home=$RUNNER_TEMP/lawdesk
          release=$home/releases/$LAWDESK_TAG
          mkdir -p "$release" "$home/state"
          (umask 027 && git archive HEAD deploy | tar -x -C "$release")
          cp -r deploy/secrets "$home/secrets"
          touch "$home/staging.env"
          host_env=(LAWDESK_IMAGE_SOURCE=local "LAWDESK_STATE_DIR=$home/state" "LAWDESK_RELEASES_DIR=$home/releases"
                    "LAWDESK_ENV_FILE=$home/staging.env" "LAWDESK_BACKUP_DIR=$home/backups" "LAWDESK_SECRETS_DIR=$home/secrets")
          env "${host_env[@]}" "$release/deploy/scripts/deploy.sh" "$LAWDESK_TAG"
          env "${host_env[@]}" "$release/deploy/scripts/deploy.sh" "$LAWDESK_TAG"
          grep -qx "$LAWDESK_TAG" "$home/state/current-release"
          ls -l "$home/backups"
          LAWDESK_HOME=$home "$release/deploy/host/rollback-drill.sh" | tee "$RUNNER_TEMP/drill.log"
          grep -q "DRILL PASSED" "$RUNNER_TEMP/drill.log"
          cat "$home/state/history.log"
      - name: Stack logs
        if: always()
        run: docker compose -p lawdesk-staging -f deploy/compose.yaml logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose -p lawdesk-staging -f deploy/compose.yaml down -v
      - name: Remove this run's network and images
        if: always()
        run: |
          docker network rm lawdesk-edge > /dev/null 2>&1 || true
          docker image rm -f "$LAWDESK_REGISTRY/backend:$LAWDESK_TAG" "$LAWDESK_REGISTRY/web:$LAWDESK_TAG" > /dev/null 2>&1 || true
          docker image prune -f > /dev/null 2>&1 || true

  secrets:
    name: Secret scan (gitleaks 8.30.1)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan full history
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  develop-guard:
    name: Develop guard (QA-cleared merge)
    # Branch protection is unavailable on this plan (B4): every push to develop must be exactly one merge of a pull
    # request whose head QA cleared with "QA-VERDICT: PASS <sha>". A failure flags the push and blocks deployment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the push against docs/delivery/DEVELOP-PROTECTION.md
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          # "uat": merged pull requests deploy without a QA verdict (owner decision 2026-10-23); unset: strict QA.
          POLICY: ${{ vars.LAWDESK_DEVELOP_POLICY || 'qa' }}
        run: python3 tools/develop_guard.py --sha "$SHA" --before "$BEFORE" --forced "$FORCED" --policy "$POLICY"

  deploy-staging:
    name: Deploy staging
    needs: [policy, backend, backend-postgres-image, frontend, stack, secrets, develop-guard]
    # Merged code only: pushes to develop in this repository, after every gate above passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'afawzy70/Lawdesk-v1'
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/deploy-staging.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit

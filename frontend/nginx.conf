# Served behind the HTTPS reverse proxy, which terminates TLS and sets HSTS.
server_tokens off;

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's embedded DNS; re-resolving keeps working when the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # Only the public health endpoints are forwarded; other actuator paths never leave the internal network.
    location ~ ^/actuator/health(/liveness|/readiness)?$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}

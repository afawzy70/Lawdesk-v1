# Served behind the HTTPS reverse proxy, which terminates TLS and sets HSTS.
server_tokens off;

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's embedded DNS; re-resolving keeps working when the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # Document upload (LD-026, QAD-037). The backend accepts a PDF of up to 10 MiB in a request of up to 11 MiB
    # (spring.servlet.multipart in application.yaml); nginx's default limit of 1 MiB refused anything larger with 413.
    # Only this route gets the larger allowance. The body is streamed to the backend (HTTP/1.1, no request buffering):
    # /tmp is RAM inside a 64 MiB container, so buffering a few parallel uploads would kill it.
    location ~ ^/api/v1/cases/[^/]+/documents$ {
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # Only the public health endpoints are forwarded; other actuator paths never leave the internal network.
    location ~ ^/actuator/health(/liveness|/readiness)?$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}

<!-- LawDesk comprehensive requirements: reviewable screen prototype (LD-DOC design package).
     Layout: a charcoal journey rail beside a paper workspace; one case followed from registration to enforcement.
     All people, numbers and judgments below are synthetic and exist only to show the screens. -->
<title>LawDesk — معاينة التصميم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --canvas:#F3EFE6; --paper:#FFFCF6; --rail:#272A29; --rail-fg:#E9E4D8; --rail-mute:#A9A597;
  --ink:#252926; --mute:#625F57; --brass:#876B3C; --accent:#6C5326; --accent-fg:#FFFCF6;
  --line:#D1C9BA; --ok:#326451; --ok-bg:#E3EFE8; --bad:#963C3B; --bad-bg:#F6E4E1; --warn:#8A5A12; --warn-bg:#F7EBD2;
  --info:#2F5774; --info-bg:#E1ECF3; --soft:#EDE7DA;
  --font-ar:"IBM Plex Sans Arabic","Cairo","Noto Sans Arabic",Tahoma,sans-serif;
  --font-en:"DM Sans","Noto Sans","Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#181A19; --paper:#222624; --rail:#101211; --rail-fg:#E9E4D8; --rail-mute:#8F8B7E;
  --ink:#ECE8DD; --mute:#A8A498; --brass:#C2A468; --accent:#C9A35E; --accent-fg:#1A1713;
  --line:#3A3F3C; --ok:#7DC3A3; --ok-bg:#1E3329; --bad:#E39A97; --bad-bg:#3A2322; --warn:#E3B968; --warn-bg:#3A2E17;
  --info:#8FBCDD; --info-bg:#1D2F3C; --soft:#2B2F2D; color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#181A19; --paper:#222624; --rail:#101211; --rail-fg:#E9E4D8; --rail-mute:#8F8B7E;
  --ink:#ECE8DD; --mute:#A8A498; --brass:#C2A468; --accent:#C9A35E; --accent-fg:#1A1713;
  --line:#3A3F3C; --ok:#7DC3A3; --ok-bg:#1E3329; --bad:#E39A97; --bad-bg:#3A2322; --warn:#E3B968; --warn-bg:#3A2E17;
  --info:#8FBCDD; --info-bg:#1D2F3C; --soft:#2B2F2D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font-family:var(--font-ar);font-size:16px;line-height:1.7;margin:0}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-fg);padding:20px 16px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
.brand{font-weight:700;font-size:20px;letter-spacing:.02em;margin:0 0 4px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--rail-mute)}
.rail h2{font-size:12px;color:var(--rail-mute);margin:20px 0 6px;font-weight:600;letter-spacing:.04em}
.rail button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:4px;cursor:pointer;font-size:14px;min-height:40px;color:var(--rail-fg)}
.rail button:hover{background:#ffffff14}
.rail button[aria-current="page"]{background:#ffffff1f;box-shadow:inset -3px 0 0 var(--brass)}
.rail button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.rail .n{font-family:var(--font-en);font-size:12px;color:var(--rail-mute);min-width:20px;text-align:center}
.main{padding:24px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px));min-width:0}
.wrap{max-width:1040px;margin:0 auto}
.crumb{font-size:13px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.syn{background:var(--warn-bg);color:var(--warn);padding:2px 10px;border-radius:4px;font-size:12px}
h1{font-size:clamp(24px,3vw,32px);line-height:1.35;margin:8px 0 4px;text-wrap:balance}
.lead{color:var(--mute);margin:0 0 20px;max-width:70ch}
h3{font-size:18px;margin:0 0 12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:20px;margin-bottom:16px;min-width:0}
.panel.top{border-top:3px solid var(--brass)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kv{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:6px 14px;margin:0}
.kv dt{color:var(--mute);font-size:14px}.kv dd{margin:0;overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:14px;color:var(--mute)}
.field input,.field select,.field textarea,select{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 10px;min-height:44px;font:inherit;width:100%}
.hint{font-size:12.5px;color:var(--mute)}
.btn{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 14px;min-height:44px;font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;border:1px solid transparent;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-info{background:var(--info-bg);color:var(--info)}.p-mute{background:var(--soft);color:var(--mute)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px;background:var(--soft)}
.num{font-family:var(--font-en);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{all:unset;cursor:pointer;padding:8px 14px;font-size:14px;border-bottom:3px solid transparent;color:var(--mute)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass);font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:110px 18px minmax(0,1fr);gap:8px;padding:6px 0}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--brass);margin-top:9px}
.tl .future .dot{background:transparent;border:2px dashed var(--mute)}
.tl .warn .dot{background:var(--bad)}
.kpi{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--brass);border-radius:4px;padding:14px;cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%}
.kpi strong{display:block;font-size:28px;font-family:var(--font-en);line-height:1.2}
.kpi span{font-size:13px;color:var(--mute)}
.callout{border-inline-start:4px solid var(--info);background:var(--info-bg);color:var(--ink);padding:10px 14px;border-radius:4px;margin:0 0 16px;font-size:14.5px}
.callout.warn{border-color:var(--warn);background:var(--warn-bg)}
.callout.bad{border-color:var(--bad);background:var(--bad-bg)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.step-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:start}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.theme{margin-top:20px;font-size:12px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;padding:12px 16px}
  .rail nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
  .rail h2{display:none}
  .rail button{width:auto;white-space:nowrap;flex:0 0 auto}
  .g2,.g3,.g4,.cols{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr)}
  .tl li{grid-template-columns:84px 14px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell" dir="rtl" lang="ar">
  <aside class="rail">
    <p class="brand">LawDesk<small>رحلة قضية واحدة · معاينة تصميم</small></p>
    <nav id="nav" aria-label="شاشات المعاينة"></nav>
    <div class="theme"><button type="button" id="themeBtn" style="all:unset;cursor:pointer;text-decoration:underline;font-size:12px;color:var(--rail-mute)">تبديل الوضع الداكن / الفاتح</button></div>
  </aside>
  <main class="main"><div class="wrap" id="view" tabindex="-1"></div></main>
</div>

      '<div class="panel top"><div class="toolbar" style="justify-content:space-between"><h3 style="margin:0">الإصدار 3 · <span class="num">2026-10-28</span></h3><span class="pill p-warn">مرتفعة</span></div>' +

      '<div class="grid g2"><div class="panel"><h3>خطة المعالجة</h3>' + table(['السبب', 'الإجراء', 'المسؤول', 'الموعد', 'الحالة'], [['كشف الاستلام ناقص', 'تصعيد طلب الإفادة', 'أ. اصطناعي', '<span class="num">2026-11-15</span>', '<span class="pill p-warn">جارية</span>']]) + '</div>' +
      '<div class="panel"><h3>الإصدارات</h3>' + table(['#', 'التاريخ', 'المستوى', 'سبب التحديث'], [['3', '<span class="num">2026-10-28</span>', 'مرتفعة', 'حكم أول درجة'], ['2', '<span class="num">2026-07-10</span>', 'متوسطة', 'مستند جديد'], ['1', '<span class="num">2026-02-16</span>', 'متوسطة', 'تقييم أولي']]) + '</div></div>';

    var P = {

      DATA_ENTRY: ['n', 'مسودة', 'مسودة', 'n', 'n', 'n', 'n'], ARCHIVIST: ['n', 'n', 'n', 'n', 'n', 'n', 'n'], READ_ONLY: ['نطاقه', 'n', 'n', 'n', 'n', 'n', 'n']
    };

    var cur = P[state.role];

    return head('الأدوار والصلاحيات', 'التحقق في الخادم عبر سياسة وصول واحدة تستعملها الشاشات والملفات والبحث والتقارير والتصدير والمساعد. لا يُمنح الاطلاع الشامل لكل عضو تلقائيًا.', 'الأقسام 30 و31') + caseBar() +
      '<div class="panel"><div class="field" style="max-width:320px"><label for="roleSel">اختر دورًا لمعاينة أثره</label><select id="roleSel">' + roles.map(function (r) { return '<option value="' + r[0] + '"' + (r[0] === state.role ? ' selected' : '') + '>' + r[1] + '</option>'; }).join('') + '</select></div>' +

      '<div class="panel"><h3>مصدر الرؤية لقضية معينة</h3><p>يرى المستخدم القضية إذا انطبق أحد: نطاقه (وحدة تنظيمية أو نوع نزاع) · عضويته (مختص، بديل، مكلَّف بمهمة) · منح صريح. القضية «المقيّدة» لا يراها إلا الأعضاء والمشرفون والممنوحون.</p>' +

  function render(id) {
    id = V[id] ? id : 'dashboard';
    $('#view').innerHTML = V[id]() + stepNav(id);
    $('#nav').innerHTML = (function () {
      var groups = {}, order = [];
      SCREENS.forEach(function (s) { if (!groups[s[2]]) { groups[s[2]] = []; order.push(s[2]); } groups[s[2]].push(s); });
      return order.map(function (g) { return '<h2>' + g + '</h2>' + groups[g].map(function (s) { return '<button type="button" data-go="' + s[0] + '"' + (s[0] === id ? ' aria-current="page"' : '') + '>' + s[1] + '</button>'; }).join(''); }).join('');
    })();
    try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (e) { /* embedded */ }
    wire(id);
    updateSummary();
  }
  function stepNav(id) {
    var i = SCREENS.findIndex(function (s) { return s[0] === id; });
    var p = SCREENS[i - 1], n = SCREENS[i + 1];
    return '<div class="step-nav">' + (p ? '<button type="button" class="btn" data-go="' + p[0] + '">→ ' + p[1] + '</button>' : '<span></span>') + (n ? '<button type="button" class="btn primary" data-go="' + n[0] + '">' + n[1] + ' ←</button>' : '') + '</div>';
  }
  function updateSummary() {
    var el = $('#jsum'); if (!el) return;
    var total = state.claims.reduce(function (a, c) { return a + (parseFloat(c.a1) || 0); }, 0);
    var accepted = state.claims.filter(function (c) { return c.r1 === 'ACCEPTED' || c.r1 === 'PARTIAL'; }).length;
    el.textContent = 'ملخص: ' + accepted + ' من ' + state.claims.length + ' طلبات قُبلت كليًا أو جزئيًا · إجمالي المبالغ المحكوم بها ' + total.toFixed(3) + ' د.ك (تُجمع من نتائج الطلبات ولا تتكرر).';
  }
  function wire(id) {
    var view = $('#view');
    view.querySelectorAll('[data-claim]').forEach(function (s) { s.addEventListener('change', function () { state.claims[+s.dataset.claim].r1 = s.value; updateSummary(); }); });
    view.querySelectorAll('[data-amt]').forEach(function (s) { s.addEventListener('input', function () { state.claims[+s.dataset.amt].a1 = s.value; updateSummary(); }); });
    var rs = $('#roleSel'); if (rs) rs.addEventListener('change', function () { state.role = rs.value; render('access'); });
    view.querySelectorAll('[data-act="rev"]').forEach(function (b) { b.addEventListener('click', function () { state.revisionOpen = !state.revisionOpen; render('claims'); }); });
    view.querySelectorAll('[data-act="approve"]').forEach(function (b) { b.addEventListener('click', function () { state.approved = true; render('deadlines'); }); });
    view.querySelectorAll('[data-key]').forEach(function (b) {

        var out = $('#filterOut');

    });
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go]');
    if (t && t.dataset.go !== 'filter') { e.preventDefault(); render(t.dataset.go); window.scrollTo(0, 0); }

  $('#themeBtn').addEventListener('click', function () {
    var r = document.documentElement, dark = r.getAttribute('data-theme') === 'dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);

  window.addEventListener('hashchange', function () { render((location.hash || '').slice(1)); });
  render((location.hash || '').slice(1));
})();

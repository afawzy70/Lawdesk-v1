# Serves the static portal only. No proxying, no autoindex, no dynamic endpoints.
server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;
    absolute_redirect off;
    etag on;
    # Only GET and HEAD exist for a static site.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "private, no-cache" always;

    location = /healthz { access_log off; default_type text/plain; add_header Cache-Control "no-store" always; return 200 "ok\n"; }

    # The vendored upstream map is one self-contained file. It may run its own inline script, but it may not make a
    # single network request (connect-src 'none'): the upstream Ask and waitlist features cannot work, by construction.
    location = /map/lawdesk-map.html {
        include /etc/nginx/snippets/security-headers-base.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; worker-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header Cache-Control "private, no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private, max-age=3600, must-revalidate" always;
    }

    # Never serve dotfiles or build metadata other than build.json.
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
